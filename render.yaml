services:
  - type: web
    runtime: static
    name: blackhat-website
    repo: https://github.com/unagee/blackhat-website
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pnpm install --frozen-lockfile && if [ "$IS_PULL_REQUEST" = "true" ]; then export SITE_ENV=preview; fi && pnpm --filter web build
    staticPublishPath: ./web/dist
    buildFilter:
      paths:
        - web/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
    previews:
      generation: automatic
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Change to the real domain once one is connected in Render.
      - key: WEBSITE_URL
        value: https://blackhat-website.onrender.com
      - key: SITE_ENV
        value: production
    # Old blackhat.agency (Squarespace) addresses, kept working after the domain moves here.
    routes:
      - type: redirect
        source: /services
        destination: /what-we-do
      - type: redirect
        source: /branding-visual-identity
        destination: /what-we-do/brand-visual-identity
      - type: redirect
        source: /animation
        destination: /what-we-do/3d-animation-motion-graphics
      - type: redirect
        source: /strategy
        destination: /what-we-do/strategy-consulting
    headers:
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'self'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=(), payment=()
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
